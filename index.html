<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>开源软件 · 书海拾贝</title>
<meta name="description" content="开源软件目录，可按平台和类别筛选。下载链接稍后补充。">
<meta name="robots" content="noindex, follow">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#2a241e">
<link rel="icon" href="assets/logo-mark.png" type="image/png">
<script>
(function(){try{var t=localStorage.getItem("ebook-vault-theme");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}
try{var l=localStorage.getItem("ebook-vault-lang");document.documentElement.setAttribute("data-site-lang",l==="en"?"en":"zh");document.documentElement.lang=l==="en"?"en":"zh-CN";}catch(e2){document.documentElement.setAttribute("data-site-lang","zh");}})();
</script>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/software.css">
<link rel="stylesheet" href="assets/open-source.css">
</head>
<body class="search-only software-list os-page" data-page="list">
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html"><img class="brand-mark" src="assets/logo-mark.png" alt="" width="26" height="26"><span class="brand-text"><span class="brand-name" data-i18n="brand">书海拾贝</span></span></a>
    <nav class="header-nav" aria-label="主导航">
      <a class="header-papers" href="index.html" aria-current="page" aria-label="开源软件" data-i18n="openSource" data-i18n-aria="openSource">开源软件</a>
    </nav>
    <div class="header-tools">
      <div class="lang-switch" id="lang-switch">
        <button type="button" class="lang-btn" id="lang-toggle" data-lang="en" aria-label="Switch to English" title="Switch to English">EN</button>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="切换主题">🌙</button>
    </div>
  </div>
</header>
<div class="search-well">
  <div class="search" role="search">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="m16.5 16.5 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
    <input id="q" class="search-input" type="search" inputmode="search" placeholder="搜索软件名称、简介、许可证或类别" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchAria" aria-label="搜索开源软件" autocomplete="off" spellcheck="false" enterkeyhint="search">
    <kbd class="kbd" aria-hidden="true">/</kbd>
  </div>
</div>
<main class="layout">
  <section class="papers-filters os-filter-panel" id="cat-panel" aria-label="平台与类别" data-i18n-aria="filtersAria">
    <p class="os-lead" id="os-lead">共 0 款开源软件</p>
    <div class="os-filters">
      <div class="chips" id="os-platforms" role="group" aria-label="平台"></div>
      <label class="os-cat"><span data-i18n="category">类别</span><select id="os-cat"></select></label>
    </div>
  </section>
  <section class="content" aria-label="开源软件列表">
    <div class="toolbar"><p class="count" id="count-wrap">当前显示 0 / 0 款</p></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <p class="empty-title" id="empty-title" data-i18n="emptyTitle">没有找到相关软件</p>
      <p class="empty-hint" id="empty-hint" data-i18n="emptyHint">试试更短的名称，或换一个平台。</p>
      <button type="button" class="btn primary" id="empty-reset" data-i18n="emptyReset">清空搜索</button>
    </div>
    <div class="load-more-wrap">
      <button type="button" class="btn load-more" id="load-more" hidden>加载更多</button>
    </div>
  </section>
</main>
<footer class="site-footer"><div class="footer-inner">
  <p class="footer-notice"><span data-i18n="footerLead">本站发布的内容若侵犯到您的权益，</span><span data-i18n="footerContact">请联系我们</span><span data-i18n="footerTail">，我们将及时处理！</span></p>
  <p class="footer-notice" data-i18n="footerNote">书籍与论文由网络公开资源整理，软件来自网络公开分享；本站不存储、不复制、不传播任何文件。</p>
</div></footer>
<noscript><p class="empty-hint">目录需要 JavaScript 才能列出。请启用 JavaScript 后刷新。</p></noscript>
<script src="assets/open-source-catalog.js"></script>
<script src="assets/open-source-downloads.js"></script>
<script src="assets/open-source-avatars.js"></script>
<script src="assets/open-source.js"></script>
<script src="assets/nav-scroll.js" defer></script>
</body>
</html>
